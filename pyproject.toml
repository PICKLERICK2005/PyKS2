[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyks2"
version = "1.2.0b2"
description = "A Python client and CLI for the Pentax K-S2's undocumented WiFi HTTP API, plus a reverse-engineering write-up. (Web GUI planned.)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jamal El Siblany", email = "jamalsiblani@gmail.com" }]
keywords = ["pentax", "k-s2", "camera", "wifi", "reverse-engineering",
            "tethering", "remote-control", "mjpeg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
async = ["httpx>=0.24", "websockets>=11"]
# The shipped camera simulator (pyks2.testing). starlette + uvicorn are the
# ASGI app and the real socket it needs; requests/websockets are what the
# pyks2 client itself uses to talk to it.
testing = ["starlette>=0.37", "uvicorn>=0.29", "pytest>=7", "pyks2[async]"]
dev = ["pytest>=7", "mypy>=1.0", "ruff>=0.4", "pyks2[async]", "pyks2[testing]"]

[project.scripts]
pyks2 = "pyks2.cli:main"

[project.entry-points.pytest11]
# Makes the ks2_simulator fixture available to downstream test suites as soon
# as pyks2[testing] is installed, with no pytest_plugins wiring.
pyks2_simulator = "pyks2.testing.pytest_plugin"

[project.urls]
Homepage = "https://github.com/PICKLERICK2005/pyks2"
Documentation = "https://PICKLERICK2005.github.io/pyks2/"
Repository = "https://github.com/PICKLERICK2005/pyks2"
Issues = "https://github.com/PICKLERICK2005/pyks2/issues"
Changelog = "https://github.com/PICKLERICK2005/pyks2/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pyks2", "pyks2.testing"]

[tool.setuptools.package-data]
# The simulator serves these at runtime, so they must ship in the wheel too —
# MANIFEST.in alone only covers the sdist. Matched by wildcard rather than by
# extension on purpose: an extension list silently drops any new fixture type,
# which is a packaging bug you only discover from an installed wheel.
"pyks2.testing" = ["data/*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
